<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   style="stop-color:#1a2a5c;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#2471a3;stop-opacity:1"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%"   style="stop-color:rgba(255,255,255,0.15);stop-opacity:1"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0);stop-opacity:1"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Decorative circles -->
  <circle cx="96" cy="90" r="48" fill="rgba(255,255,255,0.08)"/>
  <circle cx="704" cy="510" r="72" fill="rgba(255,255,255,0.08)"/>
  <circle cx="680" cy="72" r="36" fill="rgba(255,255,255,0.06)"/>
  <circle cx="120" cy="510" r="54" fill="rgba(255,255,255,0.06)"/>
  <circle cx="400" cy="300" r="150" fill="rgba(255,255,255,0.05)"/>
  <!-- Glow -->
  <ellipse cx="400" cy="300" rx="400" ry="300" fill="url(#glow)"/>
  <!-- Emoji -->
  <text x="400" y="264" text-anchor="middle" dominant-baseline="middle" font-size="132" font-family="Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif">🐕</text>
  <!-- Label -->
  <text x="400" y="435" text-anchor="middle" font-size="39" font-weight="700" font-family="Poppins,Arial,sans-serif" fill="white" opacity="0.95">Perros Corriendo</text>
</svg>